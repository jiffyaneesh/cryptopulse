# nginx.conf — CryptoPulse Nginx Configuration
# ──────────────────────────────────────────────
# Serves the Vite static build and proxies API/WebSocket traffic to FastAPI.
#
# WebSocket proxy requirements:
#   The Upgrade and Connection headers MUST be forwarded for WebSocket
#   connections to work through Nginx. Without these, Nginx treats the
#   WS handshake as a regular HTTP request and the connection fails with 400.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression for text assets (JS, CSS, JSON)
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript;
    gzip_min_length 1000;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Upstream FastAPI service (Docker service name resolves via Docker DNS)
    upstream fastapi {
        server fastapi:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Static Assets (Vite build output) ────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;  # SPA fallback for React Router
        }

        # ── REST API Proxy ────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://fastapi;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── WebSocket Proxy ───────────────────────────────────────────────
        # CRITICAL: Upgrade and Connection headers must be forwarded.
        # Without these, Nginx rejects the WS handshake with HTTP 400.
        location /ws/ {
            proxy_pass             http://fastapi;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "Upgrade";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            # Long timeout: WebSocket connections are persistent.
            # Default 60s would disconnect live dashboards every minute.
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ── Health Check ──────────────────────────────────────────────────
        location /health {
            proxy_pass http://fastapi/health;
        }
    }
}
